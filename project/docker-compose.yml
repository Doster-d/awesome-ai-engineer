services:
  contract-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-https://litellm.g-309.ru/v1}
      RLM_STUDENT_MODEL: ${RLM_STUDENT_MODEL:-openai/gemma-4-e4b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      RLM_TEACHER_MODEL: ${RLM_TEACHER_MODEL:-openrouter/anthropic/claude-3.5-sonnet}
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    command: uv run uvicorn contract_inspector.service.api:app --host 0.0.0.0 --port 8000
