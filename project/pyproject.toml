[project]
name = "contract_inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Doster-d", email = "63081538+Doster-d@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "clearml>=2.1.7",
    "dvc>=3.64.0",
    "matplotlib>=3.10.7",
    "orjson>=3.11.4",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "typer>=0.20.0",
]

[project.scripts]
contract_inspector = "contract_inspector:main"
ci_download_data="contract_inspector.data.download_data:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_inspector"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "notebook>=7.5.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "notebooks"]
extraPaths = ["src"]
pythonVersion = "3.13"

[tool.ty.environment]
python = "./.venv"
python-version = "3.13"
root = ["./src"]
