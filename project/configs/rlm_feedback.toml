[gepa]
feedback_template = "Нужно вернуть валидный JSON. Если среди evidence есть цитата, которая отвечает на вопрос, ставь found=true и включай эту цитату в evidence. Если цитаты нет, ставь found=false. Не выдумывай текст вне evidence. Совпадение с эталонной цитатой: {quote_score:.2f}; итоговая оценка: {score:.2f}."
